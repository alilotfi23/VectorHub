name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly 03:00 UTC: the full-suite date-seeded random-order job below.
  # Cron events only trigger the workflow for jobs explicitly gated on
  # `github.event_name == 'schedule'` — push/PR runs ignore them.
  schedule:
    - cron: "0 3 * * *"

env:
  # Testcontainers needs Docker; the integration/e2e suites boot real
  # Postgres, Redis, MinIO, Chroma, Qdrant, Weaviate, and (in the dedicated
  # milvus job) the Milvus trio (etcd + MinIO sidecars).
  PYTHON_VERSION: "3.13"

jobs:
  lint-type:
    name: lint + type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync dependencies
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check app tests alembic
      - name: ruff format
        run: uv run ruff format --check app tests alembic
      - name: mypy
        run: uv run mypy .

  tests-random-order:
    name: tests (randomized order)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Run suite in randomized order
        # Randomized order is the hardening gate: order-dependent registry,
        # fixture, and middleware state (e.g. a fixture re-registering an
        # adapter class from settings defaults, or a layer conftest
        # re-exporting session-scoped fixtures) fails here instead of
        # silently passing in a fixed order. pytest-random-order prints the
        # seed used — reproduce a failure with --random-order-seed=<seed>.
        # The soak (100k-vector ingest, throughput validation) and the
        # milvus-marked tests (the Milvus trio — its own job below, so a
        # Milvus timeout can't block the rest of the pipeline) are
        # deselected.
        run: |
          uv run pytest -q \
            --random-order \
            --random-order-bucket=global \
            -m "not soak and not milvus"

  tests-milvus:
    name: tests (Milvus trio)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Run milvus-marked suite
        # Milvus standalone (etcd + MinIO sidecars) is the heaviest container
        # set in the suite, so it runs in its own job per the deployment
        # policy: a Milvus startup timeout must not block the rest of the
        # pipeline. Still randomized, so the order-dependency gate holds for
        # these tests too.
        run: |
          uv run pytest -q \
            --random-order \
            --random-order-bucket=global \
            -m "milvus"

  deploy-smoke:
    # The deployment gate: boots the FULL compose stack (all four vector
    # backends incl. the Milvus trio, MinIO, Postgres, Redis, app + worker)
    # and asserts the internal admin app's /health reports status ok — every
    # adapter healthy and worker heartbeats fresh — plus the public /health
    # 404 boundary. Runs deploy/smoke.sh, which builds the image, polls
    # /health, dumps diagnostics on failure, and tears down. An artifact
    # that parses but doesn't boot (like the Milvus config panic caught in
    # Phase 8) fails here, before anything is pushed.
    name: deploy smoke (compose + health)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Boot stack and assert /health ok
        run: deploy/smoke.sh

  docker-image:
    # Pushes the production image to ghcr.io on main so the k8s overlays
    # have a deployable image. Gated on the deploy smoke: nothing is pushed
    # until the full stack boots healthy. On PRs, deploy-smoke already
    # built and validated the same Dockerfile, so no separate build runs.
    # The image serves both apps in one process (python -m app.main) and
    # carries the worker + migrate entrypoints.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: build + push image
    runs-on: ubuntu-latest
    needs: [lint-type, deploy-smoke]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tests-nightly-seed:
    # Nightly full-permutation exploration: every push/PR already samples a
    # fresh random permutation (pytest-random-order derives the seed from
    # the random source), but a given bug only surfaces under the specific
    # permutations that happen to run. The cron re-runs the FULL suite —
    # milvus trio and soak included, which the per-push jobs deselect —
    # with a seed derived from the date: fixed per run (reproducible, so a
    # failure can be re-run with --random-order-seed=<seed>) and different
    # every night, so the permutation space is explored over time. The
    # heavy-milvus-isolation policy is relaxed here because this is a
    # background job, not a gate: a timeout costs a nightly run, not the
    # pipeline.
    if: github.event_name == 'schedule'
    name: tests (nightly random seed)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Run full suite with date-derived seed
        run: |
          SEED="$(date +%Y%m%d)"
          echo "Exploring permutation for seed: $SEED"
          uv run pytest -q \
            --random-order \
            --random-order-bucket=global \
            --random-order-seed="$SEED"
