# Cloud-managed variant: the control plane (Postgres, Redis, MinIO for batch
# staging) runs locally/self-hosted, but the four vector backends are managed
# endpoints supplied as environment variables — Qdrant Cloud, Weaviate Cloud,
# Zilliz Cloud (managed Milvus), self-hosted Chroma elsewhere.
#
# The vector URLs are REQUIRED (${VAR:?} fails fast at `docker compose
# config` if unset): silently defaulting to localhost would point the
# adapters at dead endpoints and the health report at per-backend "down".
# Set them from a shell/.env, e.g.:
#   QDRANT_URL=https://xxx.cloud.qdrant.io:6333
#   WEAVIATE_URL=https://xxx.weaviate.cloud
#   WEAVIATE_GRPC_PORT=443
#   MILVUS_URL=https://xxx.zillizcloud.com:19530
#   CHROMA_URL=http://chroma:8000
# Same image as the full stack — this file only changes the environment.
name: vectorhub-cloud

x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-staging}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  API_HOST: 0.0.0.0
  API_PORT: 8000
  ADMIN_HOST: 0.0.0.0
  ADMIN_PORT: 9091
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in cloud mode}
  BOOTSTRAP_PLATFORM_ADMIN_EMAILS: ${BOOTSTRAP_PLATFORM_ADMIN_EMAILS:-}
  DATABASE_URL: postgresql+asyncpg://app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set}@postgres:5432/vectorhub
  REDIS_URL: redis://redis:6379/0
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be an explicit allow-list in cloud mode}
  BATCH_STORAGE_ENDPOINT: ${BATCH_STORAGE_ENDPOINT:-http://minio:9000}
  BATCH_STORAGE_ACCESS_KEY: ${BATCH_STORAGE_ACCESS_KEY:?BATCH_STORAGE_ACCESS_KEY must be set}
  BATCH_STORAGE_SECRET_KEY: ${BATCH_STORAGE_SECRET_KEY:?BATCH_STORAGE_SECRET_KEY must be set}
  BATCH_STORAGE_BUCKET: ${BATCH_STORAGE_BUCKET:-vectorhub-batches}
  QDRANT_URL: ${QDRANT_URL:?QDRANT_URL must point at your managed Qdrant endpoint}
  WEAVIATE_URL: ${WEAVIATE_URL:?WEAVIATE_URL must point at your managed Weaviate endpoint}
  WEAVIATE_GRPC_PORT: ${WEAVIATE_GRPC_PORT:-443}
  MILVUS_URL: ${MILVUS_URL:?MILVUS_URL must point at your managed Milvus endpoint}
  CHROMA_URL: ${CHROMA_URL:?CHROMA_URL must point at your Chroma endpoint}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: vectorhub
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vectorhub"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Batch staging only in cloud mode (no Milvus sidecar). Point
  # BATCH_STORAGE_ENDPOINT at S3-compatible storage instead (AWS S3, etc.) —
  # the same image works against MinIO or S3 via the BATCH_STORAGE_* env.
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BATCH_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${BATCH_STORAGE_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mc-init:
    image: minio/mc:latest
    entrypoint: /bin/sh -c "mc alias set local http://minio:9000 ${BATCH_STORAGE_ACCESS_KEY} ${BATCH_STORAGE_SECRET_KEY} && mc mb --ignore-existing local/${BATCH_STORAGE_BUCKET:-vectorhub-batches}"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  migrate:
    image: vectorhub-platform:dev
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/usr/local/bin/migrate.sh"]
    environment:
      MIGRATOR_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/vectorhub
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: vectorhub-platform:dev
    build:
      context: ..
      dockerfile: Dockerfile
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      mc-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  worker:
    image: vectorhub-platform:dev
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      mc-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-data:
  minio-data:
