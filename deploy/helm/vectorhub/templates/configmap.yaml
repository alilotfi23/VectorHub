apiVersion: v1
kind: ConfigMap
metadata:
  name: vectorhub-config
  labels:
    {{- include "vectorhub.labels" . | nindent 4 }}
data:
  APP_NAME: vectorhub-platform
  ENVIRONMENT: {{ .Values.environment | quote }}
  LOG_FORMAT: {{ .Values.logFormat | quote }}
  API_HOST: "0.0.0.0"
  API_PORT: {{ .Values.api.port | quote }}
  # The admin app binds the pod's container network. There is deliberately NO
  # Service/Ingress for this port — probes hit the pod directly.
  ADMIN_HOST: {{ .Values.admin.host | quote }}
  ADMIN_PORT: {{ .Values.admin.port | quote }}
  REDIS_URL: {{ include "vectorhub.redisUrl" . | quote }}
  BATCH_STORAGE_ENDPOINT: {{ include "vectorhub.batchStorageEndpoint" . | quote }}
  BATCH_STORAGE_BUCKET: {{ .Values.minio.bucket | quote }}
  QDRANT_URL: {{ .Values.backends.qdrantUrl | quote }}
  WEAVIATE_URL: {{ .Values.backends.weaviateUrl | quote }}
  WEAVIATE_GRPC_PORT: {{ .Values.backends.weaviateGrpcPort | quote }}
  MILVUS_URL: {{ .Values.backends.milvusUrl | quote }}
  CHROMA_URL: {{ .Values.backends.chromaUrl | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.corsAllowedOrigins | quote }}
