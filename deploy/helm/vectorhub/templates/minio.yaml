{{- if .Values.minio.enabled }}
# MinIO: async batch staging bucket. Set minio.endpoint + the key overrides
# to use S3-compatible storage instead (this block is skipped).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  labels:
    {{- include "vectorhub.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.minio.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    {{- include "vectorhub.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vectorhub
      component: minio
  template:
    metadata:
      labels:
        app: vectorhub
        component: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-05-28T17-19-04Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: vectorhub-secrets
                  key: BATCH_STORAGE_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vectorhub-secrets
                  key: BATCH_STORAGE_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            periodSeconds: 5
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    {{- include "vectorhub.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  selector:
    app: vectorhub
    component: minio
  ports:
    - { port: 9000, targetPort: 9000 }
{{- end }}
