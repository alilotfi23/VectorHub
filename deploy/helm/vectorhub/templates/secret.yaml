# Credentials. The values here are dev placeholders — override per
# environment with -f values-<env>.yaml, --set, or replace this Secret with
# external-secrets / sealed-secrets / Vault (same name, same keys).
apiVersion: v1
kind: Secret
metadata:
  name: vectorhub-secrets
  labels:
    {{- include "vectorhub.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.jwt.secret | quote }}
  # The initial Alembic migration creates the app/migrator roles; these
  # passwords are deployment-owned and set by the migrate initContainer.
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_APP_PASSWORD: {{ .Values.postgres.appPassword | quote }}
  POSTGRES_MIGRATOR_PASSWORD: {{ .Values.postgres.migratorPassword | quote }}
  {{- $batchKey := or .Values.minio.accessKeyOverride .Values.minio.accessKey }}
  {{- $batchSecret := or .Values.minio.secretKeyOverride .Values.minio.secretKey }}
  BATCH_STORAGE_ACCESS_KEY: {{ $batchKey | quote }}
  BATCH_STORAGE_SECRET_KEY: {{ $batchSecret | quote }}
  SENTRY_DSN: {{ .Values.sentry.dsn | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otelExporterEndpoint | quote }}
