# Self-hosted Weaviate (dev/staging overlays). The REST (8080) and gRPC
# (50051) ports both route to the one pod — the adapter uses gRPC for
# queries and REST for management.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: weaviate
spec:
  serviceName: weaviate
  replicas: 1
  selector:
    matchLabels: { app: vectorhub, component: weaviate }
  template:
    metadata:
      labels: { app: vectorhub, component: weaviate }
    spec:
      containers:
        - name: weaviate
          image: semitechnologies/weaviate:1.28.4
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 50051, name: grpc }
          env:
            - name: PERSISTENCE_DATA_PATH
              value: /var/lib/weaviate
            - name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
              value: "true"
          readinessProbe:
            httpGet: { path: /v1/.well-known/ready, port: http }
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 2, memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/weaviate }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 10Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: weaviate
spec:
  selector: { app: vectorhub, component: weaviate }
  ports:
    - { port: 8080, targetPort: http, name: http }
    - { port: 50051, targetPort: grpc, name: grpc }
