# Credentials. The values here are DEV PLACEHOLDERS — every overlay ships a
# secret-patch.yaml replacing them, and production should use external-secrets
# / sealed-secrets / Vault rather than committing real values anywhere.
#
# The initial Alembic migration creates the `app` and `migrator` Postgres
# roles; their passwords are deployment-owned and set by deploy/migrate.sh
# (run as the migrate initContainer on both app and worker pods).
apiVersion: v1
kind: Secret
metadata:
  name: vectorhub-secrets
type: Opaque
stringData:
  JWT_SECRET: dev-secret-change-me
  POSTGRES_PASSWORD: postgres
  POSTGRES_APP_PASSWORD: app
  POSTGRES_MIGRATOR_PASSWORD: migrator
  BATCH_STORAGE_ACCESS_KEY: minioadmin
  BATCH_STORAGE_SECRET_KEY: minioadmin
  SENTRY_DSN: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
