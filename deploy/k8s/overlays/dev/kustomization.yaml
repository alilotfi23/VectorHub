# Dev overlay: everything self-hosted (base + backends), base dev secrets
# (fine for a local/kind cluster), a single app replica.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../backends
images:
  - name: vectorhub-platform
    newName: ghcr.io/your-org/vectorhub-platform
    newTag: dev
patches:
  - target: { kind: Deployment, name: app }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Ingress, name: app }
    path: ingress-host.yaml
