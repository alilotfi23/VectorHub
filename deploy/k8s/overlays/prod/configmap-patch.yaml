apiVersion: v1
kind: ConfigMap
metadata:
  name: vectorhub-config
data:
  ENVIRONMENT: prod
  LOG_FORMAT: json
  # Managed vector endpoints — replace with the real cloud URLs:
  QDRANT_URL: https://CHANGE_ME.cloud.qdrant.io:6333
  WEAVIATE_URL: https://CHANGE_ME.weaviate.cloud
  WEAVIATE_GRPC_PORT: "443"
  MILVUS_URL: https://CHANGE_ME.zillizcloud.com:19530
  CHROMA_URL: http://CHANGE_ME-chroma:8000
  # Explicit allow-list only — "*" is refused here on purpose.
  CORS_ALLOWED_ORIGINS: "https://app.example.com"
