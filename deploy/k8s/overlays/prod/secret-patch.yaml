# !!! REPLACE EVERY CHANGE_ME BEFORE APPLYING !!! Production credentials
# belong in external-secrets / sealed-secrets / Vault, not this file — keep
# it as the shape reference and source the values from your secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: vectorhub-secrets
stringData:
  JWT_SECRET: CHANGE_ME
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_APP_PASSWORD: CHANGE_ME
  POSTGRES_MIGRATOR_PASSWORD: CHANGE_ME
  BATCH_STORAGE_ACCESS_KEY: CHANGE_ME
  BATCH_STORAGE_SECRET_KEY: CHANGE_ME
  SENTRY_DSN: https://CHANGE_ME@o0.ingest.sentry.io/0
