# !!! REPLACE EVERY CHANGE_ME BEFORE APPLYING !!!
# Prefer external-secrets / sealed-secrets over committing these; if you keep
# this file, generate values with e.g. `openssl rand -hex 32` and never
# commit the filled-in version.
apiVersion: v1
kind: Secret
metadata:
  name: vectorhub-secrets
stringData:
  JWT_SECRET: CHANGE_ME
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_APP_PASSWORD: CHANGE_ME
  POSTGRES_MIGRATOR_PASSWORD: CHANGE_ME
  BATCH_STORAGE_ACCESS_KEY: CHANGE_ME
  BATCH_STORAGE_SECRET_KEY: CHANGE_ME
