# VectorHub monitoring scrape config.
# Mounted into the prometheus container at /etc/prometheus/prometheus.yml
# (see deploy/monitoring/docker-compose.yml).
#
# The vhk job scrapes the platform's internal admin app, which serves /metrics
# on ADMIN_HOST:ADMIN_PORT (default 127.0.0.1:9091) — see app/admin.py. In the
# main docker-compose the app service is named `app`, so the default target is
# app:9091. Running this stack standalone against an API on the host? Point
# the target at the host, e.g. host.docker.internal:9091 (Docker Desktop).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The platform itself: /metrics on the internal admin app.
  - job_name: vhk
    metrics_path: /metrics
    static_configs:
      - targets: ["app:9091"]

  # Self-scrape, so the pipeline is provably working even before the app is up.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
