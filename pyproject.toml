[project]
name = "vectorhub-platform"
version = "0.1.0"
description = "Unified REST API over Weaviate, Qdrant, Milvus, and Chroma"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "email-validator>=2.1",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "structlog>=26.1.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    "arq>=0.28.0",
    "chromadb>=1.5.9",
    "qdrant-client>=1.19.0",
    "weaviate-client>=4.23.0",
    "pymilvus>=3.0.1",
    "boto3>=1.43.72",
    "sentry-sdk>=2.68.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "aiosqlite>=0.20",
    "testcontainers[postgres, redis]>=4.6",
    "pre-commit>=3.7",
    # Config-file tests: deploy/monitoring (alerts.yml, Grafana dashboard) are
    # validated by parsing them; PyYAML is otherwise only a transitive dep.
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "psutil>=7.2.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
# ruff format formats Python code blocks inside markdown; our docs contain
# pseudo-schema blocks that are not Python. Keep ruff on Python sources only.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern is `Depends(...)` in argument defaults — intentional,
# not a mutable-default bug (same exemption FastAPI's own ruff config uses).
# require_permission(...) is likewise a factory evaluated once at import time
# (permission is fixed per route), not a per-request call.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
    "app.api.deps.require_permission",
    "app.api.deps.require_collection_permission",
    "app.api.deps.require_tenant_access",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic"]

[[tool.mypy.overrides]]
# testcontainers ships no type stubs (import-untyped under strict).
module = ["testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pymilvus ships no type stubs (import-untyped under strict); the adapter
# casts the handful of Any-returning SDK calls at the boundary.
module = ["pymilvus", "pymilvus.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One session event loop for async tests AND fixtures: the session-scoped
# SQLAlchemy engine (integration suites) pools connections bound to a single
# loop; per-test loops would leave them "Event loop is closed".
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
# 100k-vector ingest soak — validates the Chroma throughput floor (~10-30 s
# per the batch-throughput design); runs in the adapter testcontainers job.
markers = ["soak: 100k-vector adapter ingest soak (throughput floor)"]
